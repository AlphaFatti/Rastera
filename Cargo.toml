[workspace]
members = ["crates/rastera-audio", "crates/rastera-core", "crates/rastera-desktop", "crates/rastera-native-output"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.99"

[workspace.dependencies]
wgpu = "24.0.5"

[profile.release]
# Keep optimized builds runnable without invoking the optional rust-objcopy helper.
strip = false
